<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BareTime — Custom Clock</title>
<meta name="description" content="A fully customizable clock that works offline. Transparent, color and glass styles, 26 fonts, your own wallpaper.">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BareTime">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="wall" aria-hidden="true"></div>

<main id="stage">
  <div id="clock" role="timer" aria-live="off">
    <div class="card">
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
    </div>
  </div>
</main>

<div id="fab">
  <button id="btnInstall" class="fab-btn" type="button" title="Install BareTime" aria-label="Install BareTime" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
  </button>
  <button id="btnFs" class="fab-btn" type="button" title="Full screen (F)" aria-label="Full screen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="btnPanel" class="fab-btn primary" type="button" title="Customize (C)" aria-label="Customize">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    <span>Customize</span>
  </button>
</div>

<aside id="panel" aria-label="Customize clock">
  <header>
    <div class="brand">Bare<b>Time</b></div>
    <button id="btnClose" type="button" class="icon-btn" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <nav id="tabnav"></nav>
  <div id="tabs"></div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="wpFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
